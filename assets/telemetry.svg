<svg xmlns="http://www.w3.org/2000/svg" width="880" height="208" viewBox="0 0 880 208" role="img">
  <title>Repository telemetry</title>
  <style>
    /* The card paints its own panel, so contrast does not depend on the viewer's
       GitHub theme: #e6edf3 16.0:1 · #8b949e 6.2:1 · #3fb950 7.5:1 against
       #0d1117. Green is reserved for values, bars and live state. */
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      fill: #8b949e;
    }
    .title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .k     { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; fill: #8b949e; }
    .v     { font-size: 22px; fill: #3fb950; font-variant-numeric: tabular-nums; }
    .mono  { font-size: 10.5px; fill: #8b949e; }
    .live  { fill: #3fb950; }

    .dot { fill: #3fb950; animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }

    .bar {
      fill: #3fb950;
      opacity: 0.9;
      transform-box: fill-box;
      transform-origin: bottom;
      animation: grow 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    }
    .bar.zero { fill: #30363d; opacity: 1; }
    @keyframes grow {
      from { transform: scaleY(0); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot, .bar { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="879" height="207" rx="12" fill="#0d1117" stroke="#30363d"/>

  <circle class="dot" cx="26" cy="24" r="4"/>
  <text class="title" x="40" y="28">system.telemetry</text>
  <text class="k live" x="854" y="27" text-anchor="end">live</text>

  <text class="k" x="26" y="62">pushes · 16d</text><text class="v" x="26" y="92">103</text><text class="k" x="233" y="62">active days · 16d</text><text class="v" x="233" y="92">15</text><text class="k" x="440" y="62">repos touched</text><text class="v" x="440" y="92">13</text><text class="k" x="647" y="62">runner cost</text><text class="v" x="647" y="92">$0.00</text>

  <text class="k" x="26" y="124">activity cadence · 16d</text>
  <rect class="bar" x="38.4" y="154.6" width="26.9" height="17.4" rx="1.5" style="animation-delay:0.00s"/><rect class="bar" x="90.2" y="132.0" width="26.9" height="40.0" rx="1.5" style="animation-delay:0.02s"/><rect class="bar" x="141.9" y="152.6" width="26.9" height="19.4" rx="1.5" style="animation-delay:0.04s"/><rect class="bar" x="193.7" y="154.6" width="26.9" height="17.4" rx="1.5" style="animation-delay:0.05s"/><rect class="bar" x="245.4" y="165.4" width="26.9" height="6.6" rx="1.5" style="animation-delay:0.07s"/><rect class="bar" x="297.2" y="154.6" width="26.9" height="17.4" rx="1.5" style="animation-delay:0.09s"/><rect class="bar" x="348.9" y="162.0" width="26.9" height="10.0" rx="1.5" style="animation-delay:0.11s"/><rect class="bar" x="400.7" y="150.7" width="26.9" height="21.3" rx="1.5" style="animation-delay:0.13s"/><rect class="bar" x="452.4" y="152.6" width="26.9" height="19.4" rx="1.5" style="animation-delay:0.14s"/><rect class="bar" x="504.2" y="144.1" width="26.9" height="27.9" rx="1.5" style="animation-delay:0.16s"/><rect class="bar" x="555.9" y="150.7" width="26.9" height="21.3" rx="1.5" style="animation-delay:0.18s"/><rect class="bar" x="607.7" y="147.2" width="26.9" height="24.8" rx="1.5" style="animation-delay:0.20s"/><rect class="bar" x="659.4" y="152.6" width="26.9" height="19.4" rx="1.5" style="animation-delay:0.22s"/><rect class="bar" x="711.2" y="144.1" width="26.9" height="27.9" rx="1.5" style="animation-delay:0.23s"/><rect class="bar" x="762.9" y="162.0" width="26.9" height="10.0" rx="1.5" style="animation-delay:0.25s"/><rect class="bar zero" x="814.7" y="170.5" width="26.9" height="1.5" rx="1.5" style="animation-delay:0.27s"/>
  <line x1="26" y1="172.5" x2="854" y2="172.5" stroke="#30363d" stroke-width="1"/>

  <text class="mono" x="26" y="192">synced 2026-10-30 20:39 UTC · daily cadence · source: github events</text>
