<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img">
  <title>~/.andev0x — focus, stack, runtime, mode</title>
  <style>
    /* Same panel, same palette as every other card: the ~/.andev0x block is the
       visual anchor the rest of the page copies. Keys #8b949e (6.2:1), separators
       #6e7681, values #3fb950 (7.5:1) — green only where it carries meaning. */
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      fill: #8b949e;
    }
    .panel { fill: #0d1117; stroke: #30363d; }
    .hash  { fill: #3fb950; }
    .head  { fill: #8b949e; }
    .key   { fill: #8b949e; }
    .eq    { fill: #7d8590; }
    .val   { fill: #3fb950; }
    .dim   { fill: #8b949e; font-size: 11px; letter-spacing: 0.06em; }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="879" height="189" rx="12" />

  <text x="32" y="44"><tspan class="hash">#</tspan><tspan class="head" dx="8">~/.andev0x</tspan></text>
  <text class="dim" x="848" y="44" text-anchor="end">read only</text>

  <text y="82"><tspan class="key" x="32">focus</tspan><tspan class="eq" x="112">=</tspan><tspan class="val" x="136">distributed systems · storage · developer infrastructure</tspan></text>
  <text y="110"><tspan class="key" x="32">stack</tspan><tspan class="eq" x="112">=</tspan><tspan class="val" x="136">go · rust · typescript · python</tspan></text>
  <text y="138"><tspan class="key" x="32">runtime</tspan><tspan class="eq" x="112">=</tspan><tspan class="val" x="136">postgres · redis · docker · kubernetes</tspan></text>
  <text y="166"><tspan class="key" x="32">mode</tspan><tspan class="eq" x="112">=</tspan><tspan class="val" x="136">shipping</tspan></text>
</svg>
