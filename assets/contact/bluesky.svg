  <title>bluesky — @anvndev</title>
  <style>
    /* One segment of the contact bar: four pieces laid flush in a single source
       line, each owning only its own slice of the frame. The outer pair draws
       the rounded ends, every earlier segment draws the shared divider, so the
       result reads as one bordered strip. #238636 is the only non-neutral
       stroke on the page: it marks the interactive block and clears the 3:1
       non-text contrast floor (3.6:1 on #0d1117). */
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
    }
    .card { fill: #0d1117; }
    .edge { stroke: #238636; stroke-width: 1; fill: none; }
    .key  { fill: #8b949e; }
    .val  { fill: #3fb950; }
  </style>
