  <line class="edge" x1="219.5" y1="0.5" x2="219.5" y2="55.5"/>
  <g transform="translate(20 20) scale(0.6667)"><g fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.9" ry="8.6"/><path d="M3.9 9.1h16.2M3.9 14.9h16.2"/></g></g>
