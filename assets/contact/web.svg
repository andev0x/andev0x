<svg xmlns="http://www.w3.org/2000/svg" width="22" height="20" viewBox="0 0 22 20" role="img">
  <title>web — andev0x.github.io</title>
  <style>
    /* Icon-only contact row. No plate, no border, no type: four 16px glyphs
       separated by muted dots. The #6e7681 ink clears the 3:1 non-text floor
       on both #0d1117 and white; hover is the only green state. */
    .icon   { fill: #6e7681; transition: fill 160ms ease; }
    .stroke { fill: none; stroke: #6e7681; stroke-width: 1.4; stroke-linecap: round; transition: stroke 160ms ease; }
    svg:hover .icon   { fill: #3fb950; }
    svg:hover .stroke { stroke: #3fb950; }
    @media (prefers-reduced-motion: reduce) {
      .icon, .stroke { transition: none; }
    }
  </style>

  <g class="stroke" transform="translate(2 2)">
    <circle cx="8" cy="8" r="6.1"/>
    <ellipse cx="8" cy="8" rx="2.75" ry="6.1"/>
    <path d="M1.9 6.2h12.2M1.9 9.8h12.2"/>
  </g>
</svg>
