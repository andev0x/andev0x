<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img">
  <title>an ng — backend and distributed systems engineer</title>
  <style>
    /* Fixed palette, never inherited from the viewer. The panel paints its own
       #0d1117, so contrast is decided here rather than by the GitHub theme.
       Text: #e6edf3 16.0:1 · #c9d1d9 12.3:1 · #8b949e 6.2:1 · #3fb950 7.5:1. */
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      fill: #c9d1d9;
    }
    .panel  { fill: #0d1117; stroke: #30363d; }
    .prompt { font-size: 13px; fill: #3fb950; }
    .name   { font-size: 26px; font-weight: 600; fill: #e6edf3; letter-spacing: -0.01em; }
    .role   { font-size: 14px; fill: #8b949e; }
    .stack  { font-size: 12.5px; fill: #8b949e; }
    .status { font-size: 11px; letter-spacing: 0.06em; fill: #8b949e; }

    .fade { opacity: 0; animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.32s; }
    .d4 { animation-delay: 0.44s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .caret { fill: #3fb950; animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .dot { fill: #3fb950; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fade { opacity: 1; }
      .caret { opacity: 1; }
      .dot { opacity: 1; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="879" height="167" rx="12" />

  <text class="prompt fade d1" x="32" y="44">$ whoami</text>
  <text class="status fade d1" x="826" y="44" text-anchor="end">status: shipping</text>
  <circle class="dot" cx="840" cy="40" r="3.5" />

  <text class="fade d2" x="32" y="88">
    <tspan class="name">an ng</tspan>
    <tspan class="role" dx="16">backend &amp; distributed systems engineer</tspan>
  </text>

  <text class="stack fade d3" x="32" y="120">go · rust · typescript · python · postgres · redis · docker · kubernetes</text>

  <text class="prompt fade d4" x="32" y="152">$</text>
  <rect class="caret" x="44" y="141" width="8" height="13" rx="1" />
</svg>
